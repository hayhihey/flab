<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main map pin shape -->
  <path d="M 100 40 C 85 40 75 50 75 65 C 75 80 100 120 100 120 C 100 120 125 80 125 65 C 125 50 115 40 100 40 Z" 
        fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Inner circle on pin -->
  <circle cx="100" cy="60" r="8" fill="#FFFFFF"/>
  
  <!-- Path/route lines suggesting "way" -->
  <path d="M 60 140 Q 85 150 100 160 T 140 140" 
        stroke="url(#accentGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Path dots -->
  <circle cx="60" cy="140" r="4" fill="url(#logoGradient)"/>
  <circle cx="100" cy="165" r="4" fill="url(#accentGradient)"/>
  <circle cx="140" cy="140" r="4" fill="url(#logoGradient)"/>
  
  <!-- Subtle movement lines -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGradient)" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
</svg>
